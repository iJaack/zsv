[package]
name = "zsv"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
description = "Experimental regtest-only native Zcash stablecoin state-machine model"
license = "MIT"
publish = false

[dependencies]
ed25519-dalek = "2.2"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
overflow-checks = true
